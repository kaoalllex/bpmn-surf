<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <title>bpmn-surf</title>
</head>
<body>
    <header class="pu-header">
        <span class="pu-logo" aria-hidden="true">
            <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <path d="M408,452 Q515,576 620,584" fill="none" stroke="currentColor" stroke-width="96" stroke-linecap="round"/>
                <rect x="226" y="266" width="208" height="208" rx="58" fill="none" stroke="currentColor" stroke-width="96"/>
                <rect x="590" y="556" width="208" height="208" rx="58" fill="none" stroke="currentColor" stroke-width="96"/>
            </svg>
        </span>
        <span class="pu-title">bpmn-surf</span>
    </header>

    <main class="pu-hero">
        <span class="pu-hero-label">Version</span>
        <span class="pu-version" id="currentVersion">—</span>
    </main>

    <section class="pu-sites">
        <h2 class="pu-section-title">Sites</h2>
        <ul class="pu-site-list" id="siteList"></ul>
        <form class="pu-add" id="addHostForm">
            <input type="text" id="hostInput" class="pu-input" placeholder="gitlab.mycompany.com"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="submit" class="pu-primary">Add</button>
        </form>
        <div class="pu-error hidden" id="hostError"></div>
        <p class="pu-note">
            Chrome asks for access to the site you add. Tabs that are already open
            need a reload before the buttons show up there.
        </p>
    </section>

    <section class="pu-feedback">
        <a href="#" id="feedbackLink" class="pu-feedback-link" target="_blank" rel="noopener">Leave feedback</a>
    </section>

    <script src="../core/config.js"></script>
    <script src="../hosts/host-patterns.js"></script>
    <script src="popup.js"></script>
</body>
</html>
