<!-- Simplified bio-properties-panel markup: group headers + condition expression entry,
     the selectors PropertiesPanelHighlighter relies on -->
<div class="bio-properties-panel">
  <div class="bio-properties-panel-header">
    <div class="bio-properties-panel-header-labels">
      <div class="bio-properties-panel-header-type">User Task</div>
      <div class="bio-properties-panel-header-label">Review request</div>
    </div>
  </div>
  <div class="bio-properties-panel-group" data-group-id="group-general">
    <div class="bio-properties-panel-group-header">
      <div class="bio-properties-panel-group-header-title" title="General">General</div>
    </div>
    <div class="bio-properties-panel-group-entries"></div>
  </div>
  <div class="bio-properties-panel-group" data-group-id="group-asyncContinuations">
    <div class="bio-properties-panel-group-header">
      <div class="bio-properties-panel-group-header-title" title="Asynchronous continuations">Asynchronous continuations</div>
    </div>
    <div class="bio-properties-panel-group-entries"></div>
  </div>
  <div class="bio-properties-panel-group" data-group-id="group-condition">
    <div class="bio-properties-panel-group-header">
      <div class="bio-properties-panel-group-header-title" title="Condition">Condition</div>
    </div>
    <div class="bio-properties-panel-group-entries">
      <div class="bio-properties-panel-entry">
        <textarea id="bio-properties-panel-conditionExpression">${approved == true}</textarea>
      </div>
    </div>
  </div>
  <div class="bio-properties-panel-group" data-group-id="group-CamundaPlatform__InMapping">
    <div class="bio-properties-panel-group-header">
      <div class="bio-properties-panel-group-header-title" title="In mappings">In mappings</div>
    </div>
    <div class="bio-properties-panel-list open">
      <div class="bio-properties-panel-list-item">
        <div data-entry-id="CallActivity_1-inMapping-0" class="bio-properties-panel-collapsible-entry">
          <div class="bio-properties-panel-collapsible-entry-header">
            <div class="bio-properties-panel-collapsible-entry-header-title"><code>varIn</code></div>
          </div>
        </div>
      </div>
      <div class="bio-properties-panel-list-item">
        <div data-entry-id="CallActivity_1-inMapping-1" class="bio-properties-panel-collapsible-entry">
          <div class="bio-properties-panel-collapsible-entry-header">
            <div class="bio-properties-panel-collapsible-entry-header-title"><code>itemId</code></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bio-properties-panel-group" data-group-id="group-CamundaPlatform__Input">
    <div class="bio-properties-panel-group-header">
      <div class="bio-properties-panel-group-header-title" title="Inputs">Inputs</div>
    </div>
    <div class="bio-properties-panel-list open">
      <div class="bio-properties-panel-list-item">
        <div data-entry-id="ServiceTask_1-inputParameter-0" class="bio-properties-panel-collapsible-entry">
          <div class="bio-properties-panel-collapsible-entry-header">
            <div class="bio-properties-panel-collapsible-entry-header-title">messageTemplate</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
