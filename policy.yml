merge_request:
  method: 'rebase_merge' # https://docs.gitlab.com/ee/user/project/merge_requests/methods/#merge-commit-with-semi-linear-history
  squash: 'allow'
  enable_delete_branch: true
  auto_rebase: 'scheduled'
